name: Validate PR source branch

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  validate-source:
    name: Allowed source branch
    runs-on: ubuntu-latest

    steps:
      - name: Check source branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" ]; then
            echo "::error::不允许从其他仓库的分支合并"
            exit 1
          fi

          case "$HEAD_BRANCH" in
            master|team1|team2)
              echo "允许的来源分支：$HEAD_BRANCH"
              ;;
            *)
              echo "::error::不允许从 $HEAD_BRANCH 合并到 develop"
              exit 1
              ;;
          esac